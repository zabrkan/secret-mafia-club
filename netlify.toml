# Netlify build config — runs on every push once the repo is linked.
# build.sh regenerates the HTML from build.py and assembles ./public.
[build]
  command = "bash build.sh"
  publish = "public"
  functions = "netlify/functions"

# scan.js waits on a vision model reading handwriting; the 10s default is not enough.
[functions]
  node_bundler = "esbuild"

# Static site — no framework. Pretty 404 falls back to the homepage.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
